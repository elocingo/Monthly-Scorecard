<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B1F24;
    --ink-soft: #262B32;
    --paper: #F2ECDF;
    --gold: #C6963B;
    --rust: #AE5138;
    --line: rgba(242,236,223,0.14);
    --line-strong: rgba(242,236,223,0.28);
    --text-dim: rgba(242,236,223,0.55);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; background: var(--ink); }
  body{ font-family: 'Fraunces', serif; color: var(--paper); -webkit-font-smoothing: antialiased; }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 28px 18px 48px; }

  .top{ margin-bottom: 22px; }
  .top h1{ font-size: 24px; font-weight: 500; margin: 0 0 4px; }
  .summary{ font-size: 14px; color: var(--text-dim); margin: 0; }
  .summary strong{ color: var(--gold); font-weight: 600; }

  .targets{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 16px 0 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    align-items: center;
  }
  .targets span{ white-space: nowrap; }
  .targets b{ color: var(--paper); }
  .edit-targets{
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    margin-left: auto;
  }
  .edit-targets:hover{ color: var(--paper); border-color: var(--paper); }

  .day{
    border-top: 1px solid var(--line);
    padding: 14px 0;
  }
  .day:first-of-type{ border-top: 1px solid var(--line-strong); }
  .day.today{ background: rgba(198,150,58,0.06); margin: 0 -18px; padding: 14px 18px; border-top: 1px solid var(--line-strong); }

  .day-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .day-date{
    font-size: 15px;
  }
  .day-date .tag{
    font-size: 11px;
    color: var(--gold);
    margin-left: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .day-check{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .day-check.done{ background: var(--gold); border-color: var(--gold); }
  .day-check svg{
    width: 11px; height: 11px;
    stroke: var(--ink); stroke-width: 3; fill:none;
    stroke-linecap: round; stroke-linejoin: round;
    opacity: 0;
  }
  .day-check.done svg{ opacity: 1; }

  .fields{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content: space-between;
    background: var(--ink-soft);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .field label{
    font-size: 12px;
    color: var(--text-dim);
  }
  .field input{
    width: 40px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    text-align: right;
    padding: 1px 0;
  }
  .field input:focus{ outline: none; border-bottom-color: var(--gold); }
  .field.met input{ color: var(--paper); border-bottom-color: var(--rust); }

  .settings-panel{
    background: var(--ink-soft);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 20px;
    display: none;
  }
  .settings-panel.open{ display: block; }
  .settings-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .settings-row label{ font-size: 14px; }
  .settings-row input{
    width: 60px;
    background: var(--ink);
    border: 1px solid var(--line-strong);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    text-align: right;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .settings-save{
    margin-top: 10px;
    width: 100%;
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DEFAULT_TARGETS = { re: 2, content: 3, gym: 1.5, acting: 1 };
const DEFAULT_LABELS = { re: 'Real estate', content: 'Content', gym: 'Gym', acting: 'Acting' };
const STORAGE_KEY = 'scorecard_targets';
const DATA_PREFIX = 'scorecard_day_';

function loadTargets(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return DEFAULT_TARGETS;
}
function saveTargets(t){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(t)); }catch(e){}
}

let TARGETS = loadTargets();
const LABELS = DEFAULT_LABELS;

function fmtDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function headLabel(d){
  const wd = d.toLocaleDateString(undefined, { weekday: 'short' });
  return `${wd} ${d.getDate()}`;
}

const today = new Date();
today.setHours(0,0,0,0);
const year = today.getFullYear();
const month = today.getMonth();
const lastDay = new Date(year, month+1, 0).getDate();

const dates = [];
for(let day = today.getDate(); day <= lastDay; day++){
  dates.push(new Date(year, month, day));
}

function loadDay(key){
  try{
    const raw = localStorage.getItem(DATA_PREFIX + key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { re:0, content:0, gym:0, acting:0 };
}
function saveDay(key, entry){
  try{ localStorage.setItem(DATA_PREFIX + key, JSON.stringify(entry)); }catch(e){}
}

let data = {};
dates.forEach(d => { data[fmtDate(d)] = loadDay(fmtDate(d)); });

function metCount(entry){
  let c = 0;
  ['re','content','gym','acting'].forEach(k => { if((entry[k]||0) >= TARGETS[k]) c++; });
  return c;
}
function isFullDay(entry){ return metCount(entry) === 4; }

function render(){
  const app = document.getElementById('app');
  const monthName = today.toLocaleDateString(undefined, { month: 'long' });
  const fullDays = dates.filter(d => isFullDay(data[fmtDate(d)])).length;

  app.innerHTML = `
    <div class="top">
      <h1>${monthName} scorecard</h1>
      <p class="summary"><strong>${fullDays}</strong> of ${dates.length} days fully hit so far</p>
    </div>
    <div class="targets">
      <span>RE <b>${TARGETS.re}h</b></span>
      <span>Content <b>${TARGETS.content}h</b></span>
      <span>Gym <b>${TARGETS.gym}h</b></span>
      <span>Acting <b>${TARGETS.acting}h</b></span>
      <button class="edit-targets" id="editBtn">edit targets</button>
    </div>
    <div class="settings-panel" id="settingsPanel">
      ${['re','content','gym','acting'].map(k => `
        <div class="settings-row">
          <label>${LABELS[k]} (hours)</label>
          <input type="number" step="0.5" min="0" id="target_${k}" value="${TARGETS[k]}">
        </div>
      `).join('')}
      <button class="settings-save" id="saveTargets">Save targets</button>
    </div>
    <div id="days"></div>
  `;

  document.getElementById('editBtn').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('open');
  });
  document.getElementById('saveTargets').addEventListener('click', () => {
    ['re','content','gym','acting'].forEach(k => {
      let v = parseFloat(document.getElementById(`target_${k}`).value);
      if(isNaN(v) || v < 0) v = 0;
      TARGETS[k] = v;
    });
    saveTargets(TARGETS);
    render();
  });

  const daysWrap = document.getElementById('days');
  dates.forEach((d, i) => {
    const key = fmtDate(d);
    const entry = data[key];
    const isToday = i === 0;
    const done = isFullDay(entry);

    const card = document.createElement('div');
    card.className = 'day' + (isToday ? ' today' : '');
    card.innerHTML = `
      <div class="day-head">
        <div class="day-date">${headLabel(d)}${isToday ? '<span class="tag">today</span>' : ''}</div>
        <div class="day-check ${done ? 'done' : ''}">
          <svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>
        </div>
      </div>
      <div class="fields">
        ${['re','content','gym','acting'].map(k => `
          <div class="field ${(entry[k]||0) >= TARGETS[k] ? 'met' : ''}" data-key="${k}">
            <label>${LABELS[k]}</label>
            <input type="number" step="0.5" min="0" max="12" value="${entry[k] || ''}" placeholder="0" data-cat="${k}" data-date="${key}">
          </div>
        `).join('')}
      </div>
    `;
    daysWrap.appendChild(card);
  });

  daysWrap.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const cat = e.target.dataset.cat;
      const key = e.target.dataset.date;
      let val = parseFloat(e.target.value);
      if(isNaN(val) || val < 0) val = 0;
      data[key][cat] = val;
      saveDay(key, data[key]);
      render();
    });
  });
}

render();
</script>
</body>
</html>
